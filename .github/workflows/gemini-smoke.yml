name: Gemini API smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feat/relieflens-disaster-hub
    paths:
      - .github/workflows/gemini-smoke.yml

jobs:
  verify-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google GenAI SDK and Pillow
        run: python -m pip install --upgrade google-genai pillow

      - name: Verify Gemma 4 text API access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMMA_GEMINI_MODEL: gemma-4-26b-a4b-it
        run: |
          python - <<'PY'
          import os
          from google import genai

          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("GEMINI_API_KEY secret is missing or unavailable to this workflow.")

          client = genai.Client(api_key=key)
          response = client.models.generate_content(
              model=os.environ["GEMMA_GEMINI_MODEL"],
              contents="Reply with exactly: ReliefLens API connection OK",
          )
          if not response.text:
              raise SystemExit("Gemma 4 returned an empty text response.")
          print("PASS: Gemma 4 text API responded.")
          print("Model:", os.environ["GEMMA_GEMINI_MODEL"])
          print("Response received: yes")
          PY

      - name: Verify Gemma 4 image API access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMMA_GEMINI_MODEL: gemma-4-26b-a4b-it
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw
          from google import genai

          # Synthetic test image only; it contains no real incident or personal data.
          path = Path("relieflens-smoke-road.png")
          image = Image.new("RGB", (640, 360), "white")
          draw = ImageDraw.Draw(image)
          draw.rectangle((0, 230, 640, 360), fill=(90, 90, 90))
          draw.polygon([(250, 230), (390, 230), (510, 360), (130, 360)], fill=(120, 120, 120))
          draw.line((320, 245, 320, 350), fill="yellow", width=6)
          draw.polygon([(350, 170), (470, 170), (410, 270)], fill="orange")
          draw.text((360, 205), "!", fill="black")
          image.save(path)

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          uploaded = client.files.upload(file=str(path))
          response = client.models.generate_content(
              model=os.environ["GEMMA_GEMINI_MODEL"],
              contents=[uploaded, "Describe only the visible objects in one short sentence. Do not infer real-world danger."],
          )
          if not response.text:
              raise SystemExit("Gemma 4 returned an empty image-analysis response.")
          print("PASS: Gemma 4 image API responded to a synthetic image.")
          print("Model:", os.environ["GEMMA_GEMINI_MODEL"])
          print("Image response received: yes")
          PY
